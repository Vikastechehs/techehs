<!doctype html><html lang="en"><head><meta charset="utf-8"><title>PagePress 21-page fixture</title><style>
*{box-sizing:border-box}body{margin:0;background:#28292c;font-family:Arial,sans-serif}.toolbar{position:fixed;top:0;height:44px;width:100%;background:#33363a;color:white;display:flex;align-items:center;gap:10px;padding:8px;z-index:2}#pageNumber{width:60px}#viewerContainer{position:fixed;top:44px;bottom:0;left:0;right:0;overflow:auto}#viewer{width:max-content;min-width:100%;padding:12px}.page{position:relative;background:white;margin:0 auto;overflow:hidden;box-shadow:0 0 3px #000}.canvasWrapper,.canvasWrapper canvas{display:block}.textLayer{color:transparent;position:absolute;inset:0;pointer-events:none}.watermark{position:absolute;left:180px;top:650px;font-size:64px;color:rgba(205,48,48,.35);transform:rotate(-25deg);pointer-events:none}.approval{position:absolute;right:30px;bottom:90px;color:#9c3030;font-size:30px}.annotationLayer[hidden]{display:none}
</style></head><body><div class="toolbar"><label>Page <input id="pageNumber" type="number" min="1" value="4"></label><span id="numPages"></span><select id="scaleSelect"><option value="0.5">50%</option><option value="2">200%</option><option value="3">300%</option></select></div><div id="viewerContainer"><div id="viewer" class="pdfViewer"></div></div><script src="fixture.js"></script></body></html>
